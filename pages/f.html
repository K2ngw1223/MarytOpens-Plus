<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件分享 · MarytOpens</title>
  <link rel="icon" href="/assets/img/favicon.svg">
  
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <script>
    (function() {
      const apiMeta = document.querySelector('meta[name="mo-api"]');
      const api = (apiMeta && apiMeta.content) || 'https://api.example.com';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js?api=' + encodeURIComponent(api)).then(function(reg) {
          reg.addEventListener('updatefound', function() {
            const wb = reg.installing;
            if (wb) wb.addEventListener('statechange', function() {
              if (wb.state === 'activated') wb.postMessage({ type: 'mo-skip-waiting' });
            });
          });
        }).catch(function() {});
      }
    })();
  </script>
<link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body { background: linear-gradient(135deg,#0f172a,#1e1b4b); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px; }
    .share-wrap { width: 100%; max-width: 520px; }
    .share-card { background: var(--card, #fff); border-radius: 18px; padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35); color: #1a1d24; }
    .share-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .share-ico { width: 54px; height: 54px; border-radius: 14px; background: var(--accent, #6366f1)1a;
      color: var(--accent, #6366f1); display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .share-name { font-weight: 700; font-size: 17px; word-break: break-all; }
    .share-meta { color: #64748b; font-size: 13px; }
    .share-loading, .share-error { text-align: center; padding: 30px 0; color: #64748b; }
    .share-error { color: #ef4444; }
    .code-box { margin-top: 10px; }
    .back-link { display: block; text-align: center; margin-top: 16px; color: var(--accent, #6366f1); font-size: 13px; }
    /* 暗色主题下卡片反色，保持可读 */
    html.dark .share-card, html.geek .share-card { background: #11151c; color: #e6e9f0; }
  </style>
</head>
<body>
  <div class="share-wrap">
    <div class="share-card" id="card">
      <div class="share-loading" id="loading">正在加载文件信息…</div>
    </div>
  </div>

  <script>
  (function () {
    const API_BASE = (document.querySelector('meta[name="mo-api"]') || {}).content
      || 'https://api.example.com';

    function parsePath() {
      // 优先读 query（经 _redirects 302 跳转后 owner/id 在 query 中）
      const q = new URLSearchParams(location.search);
      if (q.get('owner') && q.get('id')) {
        return { owner: q.get('owner'), id: q.get('id'), raw: q.get('raw') === '1' };
      }
      // 回退：直接解析 pathname（适用于 Worker /f/:owner/:id 或 200 重写）
      const parts = location.pathname.split('/').filter(Boolean);
      if (parts[0] === 'f' && parts[1] && parts[2]) {
        return { owner: parts[1], id: parts[2], raw: parts[3] === 'raw' };
      }
      return null;
    }

    function fmtSize(b) {
      if (!b && b !== 0) return '';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(2) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }

    function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

    async function load(code) {
      const p = parsePath();
      if (!p) { renderError('分享链接格式不正确'); return; }
      const card = document.getElementById('card');
      card.innerHTML = '<div class="share-loading">正在加载文件信息…</div>';
      try {
        const u = API_BASE + '/api/share/' + encodeURIComponent(p.owner) + '/' + encodeURIComponent(p.id)
          + (code ? '?code=' + encodeURIComponent(code) : '');
        const res = await fetch(u, { headers: { 'X-Requested-With': 'fetch' } });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          if (res.status === 410) return renderError('链接已过期');
          if (data.message) return renderError(data.message);
          return renderError('文件不存在或链接无效');
        }
        if (data.requiresCode && !code) return renderCodeBox(p);
        renderFile(data, p);
      } catch (e) {
        renderError('加载失败：' + (e.message || e));
      }
    }

    function renderFile(data, p) {
      const m = data.meta || {};
      const card = document.getElementById('card');
      const sizeStr = fmtSize(m.size);
      const fname = m.name || '未命名文件';
      card.innerHTML = '';
      card.appendChild(el(
        '<div class="share-head">' +
          '<div class="share-ico">📄</div>' +
          '<div><div class="share-name">' + escapeHtml(fname) + '</div>' +
          '<div class="share-meta">' + (sizeStr ? sizeStr + ' · ' : '') + escapeHtml(m.mime || '') + '</div></div>' +
        '</div>'
      ));
      const btn = el('<button class="btn btn-primary btn-lg btn-block">下载 / 打开文件</button>');
      const dlUrl = data.downloadUrl || (API_BASE + '/f/' + encodeURIComponent(p.owner) + '/' + encodeURIComponent(p.id) + '/raw');
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = '正在准备…';
        try {
          // 通过 fetch 取回 blob 并本地触发，避免地址栏暴露 api 子域
          const res = await fetch(dlUrl, { headers: { 'X-Requested-With': 'fetch' } });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) {
          // 回退：新标签打开（此时才可能短暂出现 api 子域，但用户可主动关闭）
          window.open(dlUrl, '_blank', 'noopener');
        } finally { btn.disabled = false; btn.textContent = '下载 / 打开文件'; }
      };
      card.appendChild(btn);
      const note = el('<p style="color:#94a3b8;font-size:12px;text-align:center;margin-top:14px">文件由上传者自有 Cloudflare 存储提供</p>');
      card.appendChild(note);
      const back = el('<a class="back-link" href="/">← 返回首页</a>');
      card.appendChild(back);
    }

    function renderCodeBox(p) {
      const card = document.getElementById('card');
      card.innerHTML = '';
      card.appendChild(el('<div style="text-align:center"><div style="font-size:40px">🔒</div>' +
        '<h2 style="margin:14px 0 6px">该文件受预览码保护</h2>' +
        '<p style="color:#64748b;margin:0 0 18px">请输入分享者提供的预览码后查看。</p></div>'));
      const form = el('<form class="field code-box"><input class="input" name="code" placeholder="预览码" autocomplete="off" style="text-align:center"><button class="btn btn-primary btn-block" style="margin-top:12px">查看文件</button></form>');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const code = form.code.value.trim();
        if (code) load(code);
      });
      card.appendChild(form);
    }

    function renderError(msg) {
      const card = document.getElementById('card');
      card.innerHTML = '';
      card.appendChild(el('<div class="share-error">' + escapeHtml(msg) + '</div>'));
      card.appendChild(el('<a class="back-link" href="/">← 返回首页</a>'));
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    load(new URLSearchParams(location.search).get('code') || '');
  })();
  </script>
</body>
</html>
