<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>开发者 · MarytOpens</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#6366f1">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<script>(function(){var t=localStorage.getItem('mo_theme');var d=t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');})();</script>
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

<header id="navbar"></header>

<main class="container container-mid py-6">
  <div class="page-head row-between" style="gap:12px;flex-wrap:wrap">
    <div>
      <h1 data-i18n="oauth.title">我的应用</h1>
      <p class="muted" data-i18n="oauth.subtitle">本站作为身份提供方（IdP），可让第三方网站用你的账号登录。</p>
    </div>
    <button class="btn btn-primary" id="btnNew"><span id="icoNew"></span> <span data-i18n="oauth.new">创建应用</span></button>
  </div>

  <div class="card card-pad" style="margin-bottom:14px">
    <b class="small" data-i18n="oauth.title">接入说明</b>
    <p class="muted small mt-1">授权端点 <code id="epAuth"></code> · 令牌端点 <code id="epToken"></code>。支持 Authorization Code + PKCE。</p>
  </div>

  <div class="tabs" id="tabs" style="margin-bottom:14px"></div>

  <div id="list"></div>
</main>

<footer id="footer"></footer>
<nav id="tabbar"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  const { $, $$, esc, icon } = App;
  const T = (k, p) => I18N.t(k, p);

  let allScopes = {};
  let tab = 'apps';

  function scopeLabel(k) { const s = allScopes[k]; return s ? (s.zh || s.en || k) : k; }

  async function load() {
    const box = $('#list'); box.innerHTML = App.loadingBlock();
    try {
      if (tab === 'apps') {
        const d = await API.OAuthApps.list();
        allScopes = d.scopes || {};
        const apps = d.apps || [];
        if (!apps.length) { box.innerHTML = App.emptyState(T('oauth.empty'), '', 'code'); return; }
        box.innerHTML = '<div class="stack-lg">' + apps.map(appCard).join('') + '</div>';
        $$('.app-card', box).forEach((n) => {
          const id = n.dataset.id;
          $('.btn-edit', n).onclick = () => openEditor(id);
          $('.btn-secret', n).onclick = () => rotateSecret(id);
          $('.btn-del', n).onclick = () => removeApp(id);
        });
      } else {
        const d = await API.OAuthApps.grants();
        const g = d.grants || [];
        if (!g.length) { box.innerHTML = App.emptyState(T('oauth.grant.empty'), '', 'code'); return; }
        box.innerHTML = '<div class="stack-lg">' + g.map(grantCard).join('') + '</div>';
        $$('.grant-card', box).forEach((n) => $('.btn-revoke', n).onclick = () => revokeGrant(n.dataset.id));
      }
    } catch (e) { App.toastError(e); box.innerHTML = App.emptyState(T('common.failed'), e.message, 'alert'); }
  }

  function appCard(a) {
    return '<div class="card card-pad app-card" data-id="' + esc(a.clientId) + '">' +
      '<div class="row-between" style="gap:8px"><div class="row" style="gap:10px;min-width:0">' +
        (a.logo ? '<img class="app-logo" src="'+esc(a.logo)+'" onerror="this.style.display=\'none\'">' : '<span class="app-logo-placeholder">'+icon('code')+'</span>') +
        '<div class="grow" style="min-width:0"><b class="truncate">'+esc(a.name)+'</b>' +
        '<div class="xsmall muted">'+T('oauth.clientId')+'：<code class="select-all">'+esc(a.clientId)+'</code></div></div></div>' +
        '<span class="badge '+(a.status==='active'?'badge-ok':'badge-bad')+'">'+(a.status==='active'?'active':'suspended')+'</span></div>' +
      (a.description?'<p class="muted small mt-2">'+esc(a.description)+'</p>':'') +
      '<div class="row mt-2" style="gap:14px;flex-wrap:wrap"><span class="xsmall muted">授权数 '+(a.stats&&a.stats.authorized||0)+'</span><span class="xsmall muted">令牌 '+(a.stats&&a.stats.tokens||0)+'</span></div>' +
      '<div class="row mt-2" style="gap:8px">' +
        '<button class="btn btn-soft btn-sm btn-edit">'+T('common.edit')+'</button>' +
        '<button class="btn btn-soft btn-sm btn-secret">'+T('oauth.rotate')+'</button>' +
        '<button class="btn btn-soft btn-sm btn-danger-soft btn-del">'+T('oauth.delete')+'</button>' +
      '</div></div>';
  }

  function grantCard(g) {
    return '<div class="card card-pad grant-card" data-id="' + esc(g.clientId) + '">' +
      '<div class="row-between" style="gap:8px"><div class="row" style="gap:10px;min-width:0">' +
        (g.logo ? '<img class="app-logo" src="'+esc(g.logo)+'" onerror="this.style.display=\'none\'">' : '<span class="app-logo-placeholder">'+icon('code')+'</span>') +
        '<div class="grow"><b class="truncate">'+esc(g.name)+'</b>' +
        '<div class="xsmall muted" data-time="'+g.lastUsed+'"></div></div></div>' +
        '<button class="btn btn-soft btn-sm btn-danger-soft btn-revoke">'+T('oauth.revoke')+'</button></div>' +
      '<div class="row mt-2" style="gap:6px;flex-wrap:wrap">'+(g.scopes||[]).map((s)=>'<span class="tag">'+esc(scopeLabel(s))+'</span>').join('')+'</div></div>';
  }

  function openEditor(id) {
    (async () => {
      let app = null, scopesAll = allScopes;
      if (id) {
        try { const d = await API.OAuthApps.get(id); app = d.app; scopesAll = d.scopes || allScopes; } catch(e){ App.toastError(e); return; }
      }
      const body = document.createElement('div');
      const redirectVal = app ? (app.redirectUris||[]).join('\n') : '';
      const scopeChecks = Object.keys(scopesAll).map((k) => {
        const s = scopesAll[k];
        const checked = app ? (app.scopes||[]).includes(k) : (k === 'profile');
        const dis = s && s.always ? 'disabled' : '';
        return '<label class="check-row"><input type="checkbox" class="sc" value="'+esc(k)+'" '+(checked?'checked':'')+' '+dis+'> '+esc((s&&(s.zh||s.en))||k)+'</label>';
      }).join('');
      body.innerHTML =
        '<div class="field"><label class="label">'+T('oauth.name')+'</label><input class="input" id="fName" maxlength="60" value="'+(app?esc(app.name):'')+'" placeholder="'+T('oauth.namePh')+'"></div>' +
        '<div class="field"><label class="label">'+T('oauth.redirect')+'</label><textarea class="textarea" id="fRedirect" rows="2" placeholder="'+T('oauth.redirectPh')+'">'+(esc(redirectVal))+'</textarea><div class="hint">每行一个 URL</div></div>' +
        '<div class="field"><label class="label">'+T('oauth.scopes')+'</label><div class="check-grid">'+scopeChecks+'</div></div>' +
        '<div class="row" style="gap:10px"><div class="field grow"><label class="label">主页</label><input class="input" id="fHome" value="'+(app?esc(app.homepage||''):'')+'"></div>' +
        '<div class="field grow"><label class="label">Logo URL</label><input class="input" id="fLogo" value="'+(app?esc(app.logo||''):'')+'"></div></div>' +
        (app?'<div class="field"><label class="label">'+T('oauth.clientId')+'</label><code class="select-all">'+esc(app.clientId)+'</code></div>':'');
      const m = App.modal({ title: app ? T('common.edit') : T('oauth.new'), body, size: 'lg',
        okText: app ? T('common.save') : T('oauth.new'),
        onOk: async () => {
          const name = $('#fName', body).value.trim();
          if (name.length < 2) { App.toast.warn(T('oauth.name')); return false; }
          const redirectUris = $('#fRedirect', body).value.split('\n').map((x)=>x.trim()).filter(Boolean);
          const scopes = $$('.sc', body).filter((c)=>c.checked).map((c)=>c.value);
          const payload = { name, description: '', redirectUris, scopes, homepage: $('#fHome', body).value.trim(), logo: $('#fLogo', body).value.trim() };
          try {
            if (app) { await API.OAuthApps.update(id, payload); App.toast.success(T('common.saved')); }
            else {
              const d = await API.OAuthApps.create(payload);
              App.toast.success(T('common.success'));
              showSecret(d.app.clientSecret);
            }
            m.close(); load();
          } catch(e){ App.toastError(e); }
        }
      });
    })();
  }

  function showSecret(secret) {
    const body = document.createElement('div');
    body.innerHTML = '<div class="alert-soft">'+T('oauth.secretWarn')+'</div>' +
      '<div class="field"><label class="label">'+T('oauth.clientSecret')+'</label><code class="select-all" id="sec">'+esc(secret)+'</code></div>';
    App.modal({ title: T('oauth.clientSecret'), body, size: 'md', hideCancel: true, okText: T('common.close') });
  }

  async function rotateSecret(id) {
    if (!(await App.confirmDialog(T('oauth.rotate') + '?', { danger:true }))) return;
    try { const d = await API.OAuthApps.rotateSecret(id); showSecret(d.clientSecret); App.toast.success(T('common.saved')); } catch(e){ App.toastError(e); }
  }

  async function removeApp(id) {
    if (!(await App.confirmDialog(T('oauth.delete') + '?', { danger:true }))) return;
    try { await API.OAuthApps.remove(id); App.toast.success(T('common.deleted')); load(); } catch(e){ App.toastError(e); }
  }

  async function revokeGrant(cid) {
    if (!(await App.confirmDialog(T('oauth.revoke') + '?', { danger:true }))) return;
    try { await API.OAuthApps.revokeGrant(cid); App.toast.success(T('common.deleted')); load(); } catch(e){ App.toastError(e); }
  }

  App.boot({
    nav: 'oauth',
    requireAuth: true,
    onReady: function () {
      $('#icoNew').innerHTML = icon('code');
      $('#btnNew').onclick = () => openEditor(null);
      $('#epAuth').textContent = location.origin + '/authorize.html';
      $('#epToken').textContent = (API.BASE || 'https://api.example.com') + '/api/oauth/token';
      const t = $('#tabs');
      t.innerHTML = [
        { k:'apps', label:T('oauth.title') },
        { k:'grants', label:T('oauth.grants') },
      ].map((x) => '<button class="tab' + (x.k===tab?' active':'') + '" data-tab="' + x.k + '">' + x.label + '</button>').join('');
      $$('.tab', t).forEach((b) => b.onclick = () => { tab = b.dataset.tab; load(); });
      load();
    },
  });
})();
</script>
</body>
</html>
